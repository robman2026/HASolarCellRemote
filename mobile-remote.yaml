type: custom:button-card
grid_options:
  rows: auto
  columns: 7
visibility:
  - condition: screen
    media_query: "(min-width: 0px) and (max-width: 1023px)"
styles:
  card:
    - border-radius: 40px
    - background: "#1c1c1c"
    - box-shadow: inset 0px 4px 10px rgba(255,255,255,0.05)
    - border: "2px solid #141414"
    - padding: 30px 16px 40px 16px
    - max-width: 360px
    - width: 100%
    - margin: 0 auto
    - display: block
    - box-sizing: border-box
  custom_fields:
    remote_ui:
      - align-self: center
      - justify-self: center
      - width: 100%
custom_fields:
  remote_ui:
    card:
      type: vertical-stack
      cards:
        - type: grid
          square: false
          columns: 3
          cards:
            - type: custom:button-card
              icon: mdi:power
              icon_color: red
              styles:
                card:
                  - height: 30px
                  - border-radius: 20px
                  - background: rgba(30, 30, 30, 0.9)
                icon:
                  - color: red
                  - width: 30px
              tap_action:
                action: call-service
                service: media_player.turn_off
                target:
                  entity_id: media_player.[YourTVName]
            - type: custom:button-card
              color_type: blank-card
              styles:
                card:
                  - background: transparent
                  - box-shadow: none
            - type: custom:button-card
              icon: mdi:spotify
              styles:
                card:
                  - height: 30px
                  - border-radius: 20px
                  - background: "#1DB954"
                  - color: white
              tap_action:
                action: call-service
                service: shell_command.launch_spotify
        - type: grid
          square: true
          columns: 3
          cards:
            - type: custom:button-card
              styles:
                card:
                  - height: 50px
                  - width: 50px
                  - border-radius: 50%
                  - background: rgba(30, 30, 30, 0.9)
                  - position: relative
                  - margin: 0 auto
                grid:
                  - grid-template-areas: "\"i\" \"n\" \"dots\""
                  - grid-template-rows: 1fr 1fr 1fr
                custom_fields:
                  i:
                    - justify-self: center
                  "n":
                    - justify-self: center
                    - font-size: 10px
                    - font-weight: bold
                    - margin-top: "-5px"
                  dots:
                    - justify-self: center
                    - margin-top: "-5px"
                    - letter-spacing: "-1px"
                    - font-size: 12px
              custom_fields:
                i: >
                  <ha-icon icon="mdi:cog-outline" style="width: 15px; color:
                  white;"></ha-icon>
                "n": |
                  <p style="margin-top:20px; font-size: 10pt">123</p>
                dots: >
                  <span style="color: #ff4d4d;">●</span> <span style="color:
                  #4dff4d;">●</span> <span style="color: #ffdb4d;">●</span>
                  <span style="color: #4d94ff;">●</span>
              tap_action:
                action: call-service
                service: remote.send_command
                target:
                  entity_id: remote.[YourTVName]
                data:
                  command: KEY_MORE
            - type: custom:button-card
              icon: mdi:menu
              styles:
                card:
                  - height: 50px
                  - width: 50px
                  - border-radius: 50%
                  - margin: 0 auto
                icon:
                  - color: white
                  - width: 35px
              tap_action:
                action: call-service
                service: remote.send_command
                target:
                  entity_id: remote.[YourTVName]
                data:
                  command: KEY_MENU
            - type: custom:button-card
              icon: mdi:volume-off
              styles:
                card:
                  - height: 50px
                  - width: 50px
                  - border-radius: 50%
                  - margin: 0 auto
                icon:
                  - color: white
                  - width: 35px
              tap_action:
                action: call-service
                service: remote.send_command
                target:
                  entity_id: remote.[YourTVName]
                data:
                  command: KEY_MUTE
        - type: grid
          square: true
          columns: 3
          cards:
            - type: custom:button-card
              color_type: blank-card
              styles:
                card:
                  - background: transparent
                  - box-shadow: none
            - type: custom:button-card
              icon: mdi:chevron-up
              styles:
                card:
                  - height: 50px
                  - width: 50px
                  - border-radius: 50%
                  - background: rgba(80,80,80,0.3)
                  - margin: 0 auto
                icon:
                  - color: white
                  - width: 30px
              tap_action:
                action: call-service
                service: remote.send_command
                target:
                  entity_id: remote.[YourTVName]
                data:
                  command: KEY_UP
            - type: custom:button-card
              color_type: blank-card
              styles:
                card:
                  - background: transparent
                  - box-shadow: none
            - type: custom:button-card
              icon: mdi:chevron-left
              styles:
                card:
                  - height: 50px
                  - width: 50px
                  - border-radius: 50%
                  - background: rgba(80,80,80,0.3)
                  - margin: 0 auto
                icon:
                  - color: white
                  - width: 30px
              tap_action:
                action: call-service
                service: remote.send_command
                target:
                  entity_id: remote.[YourTVName]
                data:
                  command: KEY_LEFT
            - type: custom:button-card
              icon: mdi:circle-outline
              styles:
                card:
                  - height: 50px
                  - width: 50px
                  - border-radius: 50%
                  - background: rgba(120,120,120,0.4)
                  - margin: 0 auto
                icon:
                  - color: white
                  - width: 30px
              tap_action:
                action: call-service
                service: remote.send_command
                target:
                  entity_id: remote.[YourTVName]
                data:
                  command: KEY_ENTER
            - type: custom:button-card
              icon: mdi:chevron-right
              styles:
                card:
                  - height: 50px
                  - width: 50px
                  - border-radius: 50%
                  - background: rgba(80,80,80,0.3)
                  - margin: 0 auto
                icon:
                  - color: white
                  - width: 30px
              tap_action:
                action: call-service
                service: remote.send_command
                target:
                  entity_id: remote.[YourTVName]
                data:
                  command: KEY_RIGHT
            - type: custom:button-card
              color_type: blank-card
              styles:
                card:
                  - background: transparent
                  - box-shadow: none
            - type: custom:button-card
              icon: mdi:chevron-down
              styles:
                card:
                  - height: 50px
                  - width: 50px
                  - border-radius: 50%
                  - background: rgba(80,80,80,0.3)
                  - margin: 0 auto
                icon:
                  - color: white
                  - width: 30px
              tap_action:
                action: call-service
                service: remote.send_command
                target:
                  entity_id: remote.[YourTVName]
                data:
                  command: KEY_DOWN
            - type: custom:button-card
              color_type: blank-card
              styles:
                card:
                  - background: transparent
                  - box-shadow: none
        - type: grid
          square: true
          columns: 3
          cards:
            - type: custom:button-card
              icon: mdi:undo-variant
              styles:
                card:
                  - height: 50px
                  - width: 50px
                  - border-radius: 50%
                  - background: rgba(30,30,30,0.9)
                  - margin: 0 auto
                icon:
                  - color: white
                  - width: 30px
              tap_action:
                action: call-service
                service: remote.send_command
                target:
                  entity_id: remote.[YourTVName]
                data:
                  command: KEY_RETURN
            - type: custom:button-card
              icon: mdi:home-variant-outline
              styles:
                card:
                  - height: 50px
                  - width: 50px
                  - border-radius: 50%
                  - margin: 0 auto
                icon:
                  - color: white
                  - width: 30px
              tap_action:
                action: call-service
                service: remote.send_command
                target:
                  entity_id: remote.[YourTVName]
                data:
                  command: KEY_HOME
            - type: custom:button-card
              icon: mdi:play-pause
              styles:
                card:
                  - height: 50px
                  - width: 50px
                  - border-radius: 50%
                  - background: rgba(30,30,30,0.9)
                  - margin: 0 auto
                icon:
                  - color: white
                  - width: 30px
              tap_action:
                action: call-service
                service: remote.send_command
                target:
                  entity_id: remote.[YourTVName]
                data:
                  command: KEY_PLAYPAUSE
        - type: grid
          columns: 2
          square: false
          cards:
            - type: vertical-stack
              cards:
                - type: custom:button-card
                  icon: mdi:volume-plus
                  styles:
                    card:
                      - height: 35px
                      - border-radius: 12px
                  tap_action:
                    action: call-service
                    service: remote.send_command
                    target:
                      entity_id: remote.[YourTVName]
                    data:
                      command: KEY_VOLUP
                - type: custom:button-card
                  icon: mdi:volume-minus
                  styles:
                    card:
                      - height: 35px
                      - border-radius: 12px
                  tap_action:
                    action: call-service
                    service: remote.send_command
                    target:
                      entity_id: remote.[YourTVName]
                    data:
                      command: KEY_VOLDOWN
            - type: vertical-stack
              cards:
                - type: custom:button-card
                  icon: mdi:chevron-up
                  styles:
                    card:
                      - height: 35px
                      - border-radius: 12px
                  tap_action:
                    action: call-service
                    service: remote.send_command
                    target:
                      entity_id: remote.[YourTVName]
                    data:
                      command: KEY_CHUP
                - type: custom:button-card
                  icon: mdi:chevron-down
                  styles:
                    card:
                      - height: 35px
                      - border-radius: 12px
                  tap_action:
                    action: call-service
                    service: remote.send_command
                    target:
                      entity_id: remote.[YourTVName]
                    data:
                      command: KEY_CHDOWN
        - type: grid
          columns: 2
          square: false
          cards:
            - type: custom:button-card
              show_name: false
              styles:
                card:
                  - height: 40px
                  - border-radius: 16px
                  - background: "#000000"
                  - border: "1px solid #000"
                  - color: transparent
                  - overflow: hidden
                custom_fields:
                  logo:
                    - width: 80%
                    - height: 100%
                    - background: >-
                        url("https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg")
                        center no-repeat
                    - background-size: contain
                    - position: absolute
                    - left: 10%
              custom_fields:
                logo: " "
              tap_action:
                action: call-service
                service: shell_command.launch_netflix
            - type: custom:button-card
              show_name: false
              styles:
                card:
                  - height: 40px
                  - border-radius: 16px
                  - background: "#FFFFFF"
                  - overflow: hidden
                custom_fields:
                  content:
                    - display: flex
                    - align-items: center
                    - justify-content: center
                    - position: absolute
                    - width: 100%
                    - height: 100%
                    - top: "0"
                    - left: "0"
              custom_fields:
                content: >
                  <div
                  style="display:flex;align-items:center;justify-content:center;gap:0px;width:100%">
                    <svg viewBox="0 0 24 24" style="width:18px;height:16px;flex-shrink:0">
                      <path fill="#FF0000" d="M10,15L15.19,12L10,9V15M21.56,7.17C21.69,8.07 21.8,9.44 21.8,11.3V12.7C21.8,14.56 21.69,15.93 21.56,16.83C21.43,17.74 21.11,18.41 20.6,18.85C20.08,19.3 19.33,19.5 18.33,19.5C17.33,19.5 16,19.5 14.33,19.5H9.67C8,19.5 6.67,19.5 5.67,19.5C4.67,19.5 3.92,19.3 3.4,18.85C2.89,18.41 2.57,17.74 2.44,16.83C2.31,15.93 2.2,14.56 2.2,12.7V11.3C2.2,9.44 2.31,8.07 2.44,7.17C2.57,6.26 2.89,5.59 3.4,5.15C3.92,4.7 4.67,4.5 5.67,4.5C6.67,4.5 8,4.5 9.67,4.5H14.33C16,4.5 17.33,4.5 18.33,4.5C19.33,4.5 20.08,4.7 20.6,5.15C21.11,5.59 21.43,6.26 21.56,7.17Z" />
                    </svg>
                    <span style="color:black;font-size:13px;font-weight:bold;font-family:sans-serif;white-space:nowrap">YouTube</span>
                  </div>
              tap_action:
                action: call-service
                service: shell_command.launch_youtube
        - type: grid
          columns: 2
          square: false
          cards:
            - type: custom:button-card
              show_name: false
              styles:
                card:
                  - height: 40px
                  - border-radius: 16px
                  - background: "linear-gradient(200deg, #1098F7 0%, #001f3f 100%)"
                  - border: "1px solid #1098F7"
                  - box-shadow: inset 0px 1px 2px rgba(255,255,255,0.2)
                  - overflow: hidden
                custom_fields:
                  content:
                    - display: flex
                    - align-items: center
                    - justify-content: center
                    - position: absolute
                    - width: 100%
                    - height: 100%
                    - top: "0"
                    - left: "0"
              custom_fields:
                content: >
                  <div
                  style="display:flex;align-items:center;justify-content:center;width:100%">
                    <span style="color:white;font-size:12px;font-weight:bold;font-family:sans-serif;white-space:nowrap">Prime Video</span>
                  </div>
              tap_action:
                action: call-service
                service: shell_command.launch_prime
            - type: custom:button-card
              show_name: false
              styles:
                card:
                  - height: 40px
                  - border-radius: 16px
                  - background: "linear-gradient(180deg, #016f7d 0%, #001f3f 100%)"
                  - border: "1px solid #004d61"
                  - overflow: hidden
                custom_fields:
                  logo:
                    - width: 75%
                    - height: 100%
                    - background: >-
                        url("https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg")
                        center no-repeat
                    - background-size: contain
                    - filter: brightness(0) invert(1)
                    - position: absolute
                    - left: 12.5%
                    - top: "-2px"
              custom_fields:
                logo: " "
              tap_action:
                action: call-service
                service: shell_command.launch_disney
        - type: custom:button-card
          color_type: blank-card
          styles:
            card:
              - height: 8px
              - background: transparent
              - box-shadow: none
tap_action:
  action: none
hold_action:
  action: none
